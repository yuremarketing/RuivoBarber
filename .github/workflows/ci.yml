name: CI — Build & Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  # ─── Frontend: verificar se compila sem erros ───
  frontend-build:
    name: 🖥️ Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (deve compilar sem erros)
        run: npm run build

  # ─── Backend: compilar e rodar testes ───
  backend-build-test:
    name: 🔧 Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Build (deve compilar sem erros)
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -count=1
