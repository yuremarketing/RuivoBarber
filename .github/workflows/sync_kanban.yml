name: Sync Kanban to GitHub Projects

on:
  push:
    paths:
      - '.antigravity/kanban/**'
      - '.antigravity/logs/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Kanban Sync
        env:
          GITHUB_TOKEN: ${{ secrets.KANBAN_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python .antigravity/scripts/sync_kanban_to_github.py
